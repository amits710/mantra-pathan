<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantra Pathan — मंत्र पठण</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#8b4513">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans Devanagari", system-ui, sans-serif; color: #2a1a0a; background: #fef9ef; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; background: #8b4513; color: #fff; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 1rem; z-index: 100; }
  .topbar button { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0.25rem 0.5rem; }
  .topbar h1 { font-size: 1.2rem; font-weight: 600; }
  .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; border-right: 1px solid #e8dcc0; z-index: 200; transition: left 0.3s ease; overflow-y: auto; }
  .sidebar.open { left: 0; }
  .sidebar-header { padding: 1rem; background: #8b4513; color: #fff; font-weight: 600; }
  .sidebar ul { list-style: none; }
  .sidebar li a { display: block; padding: 0.9rem 1.25rem; color: #2a1a0a; text-decoration: none; border-bottom: 1px solid #f0e8d5; }
  .sidebar li a:hover, .sidebar li a.active { background: #fef9ef; color: #8b4513; font-weight: 600; }
  .sidebar li .prayer-meta { font-size: 0.75rem; color: #999; }
  .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 150; display: none; }
  .overlay.show { display: block; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .hero .om { font-size: 8rem; line-height: 1; color: #8b4513; margin-bottom: 1rem; }
  .hero h2 { font-size: 1.8rem; color: #8b4513; margin-bottom: 0.5rem; }
  .hero p { color: #888; font-size: 1rem; }
  footer { text-align: center; color: #aaa; font-size: 0.85rem; padding: 1.5rem; }
  footer a { color: #8b4513; }
</style>
</head>
<body>
<div class="topbar">
  <button onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <h1>॥ मंत्र पठण ॥</h1>
</div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">Prayers</div>
  <ul>
    <li><a href="/prayer/" class="active">🏠 Home</a></li>
    <li><a href="shri-dattamala-mantra.html">॥ श्रीदत्तमाला मन्त्र ॥<br><span class="prayer-meta">Sanskrit · Dattatreya</span></a></li>
  </ul>
</nav>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="hero">
  <div class="om">ॐ</div>
  <h2>मंत्र पठण</h2>
  <p>Marathi &amp; Sanskrit prayers in Devanagari</p>
</div>

<footer><a href="/">← Amit Sonar</a></footer>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
