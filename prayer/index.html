<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans Devanagari", system-ui, sans-serif; line-height: 2; color: #2a1a0a; background: #fef9ef; }
  .topbar { position: sticky; top: 0; background: #8b4513; color: #fff; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 1rem; z-index: 100; }
  .topbar button { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0.25rem 0.5rem; }
  .topbar h1 { font-size: 1.2rem; font-weight: 600; }
  .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; border-right: 1px solid #e8dcc0; z-index: 200; transition: left 0.3s ease; overflow-y: auto; }
  .sidebar.open { left: 0; }
  .sidebar-header { padding: 1rem; background: #8b4513; color: #fff; font-weight: 600; }

  .sidebar li a { display: block; padding: 0.9rem 1.25rem; color: #2a1a0a; text-decoration: none; border-bottom: 1px solid #f0e8d5; }

  .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 150; display: none; }
  .overlay.show { display: block; }
  .content { max-width: 640px; margin: 0 auto; padding: 2rem 1.5rem; }
  .prayer-card { background: #fff; border: 1px solid #e8dcc0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .prayer-card h2 { color: #8b4513; font-size: 1.3rem; margin-bottom: 0.25rem; }
  .prayer-card .meta { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
  .prayer-card a { color: #8b4513; text-decoration: none; font-weight: 600; }
  footer { text-align: center; color: #aaa; font-size: 0.85rem; margin-top: 3rem; }
